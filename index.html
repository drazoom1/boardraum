<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>보드라움 서비스 종료 안내</title>
<meta name="robots" content="noindex" />
<meta property="og:title" content="보드라움 서비스 종료 안내" />
<meta property="og:description" content="보드라움 서비스가 2026년 10월 1일자로 종료되었습니다. 그동안 함께해 주셔서 감사합니다." />
<style>
  :root{
    --bg:#11131a; --panel:#181b24; --line:#262b38;
    --ink:#eef0f6; --muted:#a6adbd; --accent:#d9b36c;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; line-height:1.75;
  }
  main{
    width:100%; max-width:560px; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:40px 32px; text-align:center;
  }
  .mark{
    font-size:13px; letter-spacing:.22em; color:var(--accent); font-weight:700; margin:0 0 22px;
  }
  h1{font-size:26px; margin:0 0 20px; letter-spacing:-.01em; text-wrap:balance}
  p{margin:0 0 16px; color:var(--muted); font-size:15.5px}
  p.lead{color:var(--ink); font-size:16.5px}
  hr{border:0; border-top:1px solid var(--line); margin:28px 0}
  .date{font-size:13.5px; color:var(--muted)}
  strong{color:var(--ink); font-weight:600}
  @media (max-width:420px){ main{padding:32px 20px} h1{font-size:22px} }
</style>
</head>
<body>
<main>
  <p class="mark">BOARDRAUM</p>
  <h1>보드라움 서비스를 종료합니다</h1>
  <p class="lead">그동안 보드라움을 찾아주시고 아껴주신 모든 분들께 깊이 감사드립니다.</p>
  <p>보드라움 커뮤니티와 모든 기능은 <strong>2026년 10월 1일</strong>자로 운영을 종료했습니다. 게시판, 컬렉션, 이벤트 등 사이트의 모든 서비스는 더 이상 이용할 수 없습니다.</p>
  <p>보드게임을 함께 즐기고 이야기 나눠주신 시간이 보드라움의 전부였습니다. 짧지 않은 시간 동안 보내주신 관심에 다시 한번 고맙습니다.</p>
  <hr />
  <p class="date">2026년 10월 1일 · 보드라움 운영자</p>
</main>
</body>
</html>
